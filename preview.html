<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Screenshot</title>
  <link rel="icon" href="icons/icon32.png">
  <style>
    :root { color-scheme: light dark; --bg:#f1f3f4; --bar:#fff; --fg:#202124; --muted:#5f6368; --border:#dadce0; --accent:#1a73e8; }
    @media (prefers-color-scheme: dark) { :root { --bg:#202124; --bar:#292a2d; --fg:#e8eaed; --muted:#9aa0a6; --border:#5f6368; --accent:#8ab4f8; } }
    * { box-sizing: border-box; }
    body { margin: 0; font: 13px system-ui, sans-serif; background: var(--bg); color: var(--fg); }
    header { position: sticky; top: 0; z-index: 2; display: flex; gap: 8px; align-items: center; flex-wrap: wrap;
             padding: 10px 16px; background: var(--bar); border-bottom: 1px solid var(--border); }
    #info { flex: 1; min-width: 200px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    #info b { color: var(--fg); font-weight: 600; }
    button { font: inherit; padding: 7px 14px; border-radius: 6px; border: 1px solid var(--border); background: var(--bar); color: var(--fg); cursor: pointer; }
    button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
    @media (prefers-color-scheme: dark) { button.primary { color: #202124; } }
    button[hidden] { display: none; }
    main { padding: 24px 16px 48px; display: flex; justify-content: center; }
    #wrap { position: relative; user-select: none; cursor: crosshair; box-shadow: 0 1px 6px rgba(0,0,0,.25); line-height: 0; }
    #wrap img { max-width: min(100%, 1400px); display: block; -webkit-user-drag: none; }
    #sel { position: absolute; display: none; border: 1.5px dashed #fff; outline: 1px solid rgba(0,0,0,.6);
           box-shadow: 0 0 0 9999px rgba(0,0,0,.45); pointer-events: none; }
    #toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: #323232; color: #fff;
             padding: 10px 16px; border-radius: 6px; opacity: 0; transition: opacity .2s; pointer-events: none; }
    #toast.show { opacity: 1; }
  </style>
</head>
<body>
  <header>
    <div id="info">Loading…</div>
    <button id="clear" hidden>Clear selection</button>
    <button id="copy">Copy</button>
    <button id="download" class="primary">Download</button>
  </header>
  <main><div id="wrap"><img id="img" alt="Screenshot"><div id="sel"></div></div></main>
  <div id="toast"></div>
  <script type="module" src="preview.js"></script>
</body>
</html>
