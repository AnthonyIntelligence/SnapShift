<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    :root {
      color-scheme: light dark;
      --bg: #ffffff; --card: #f8f9fa; --fg: #202124; --muted: #5f6368; --faint: #80868b;
      --border: #e3e5e8; --accent: #1a73e8; --accent-soft: #e8f0fe; --tile: #eef1f5; --err: #d93025;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #1f2023; --card: #28292d; --fg: #e8eaed; --muted: #a8adb3; --faint: #7f858c;
        --border: #393a3f; --accent: #8ab4f8; --accent-soft: #263445; --tile: #323439; --err: #f28b82;
      }
    }
    * { box-sizing: border-box; }
    body { width: 290px; margin: 0; font: 13px/1.35 system-ui, -apple-system, "Segoe UI", sans-serif; background: var(--bg); color: var(--fg); }

    header { display: flex; align-items: center; gap: 8px; padding: 12px 14px 8px; }
    header img { width: 18px; height: 18px; }
    header h1 { flex: 1; margin: 0; font-size: 13px; font-weight: 600; letter-spacing: .01em; }
    #shortcuts { display: grid; place-items: center; width: 26px; height: 26px; border-radius: 6px; color: var(--faint); }
    #shortcuts:hover { background: var(--card); color: var(--fg); }

    .options { display: grid; gap: 6px; padding: 4px 10px 10px; }
    button {
      display: grid; grid-template-columns: 36px 1fr auto; align-items: center; gap: 12px;
      width: 100%; padding: 10px 12px 10px 10px; font: inherit; color: inherit; text-align: left;
      background: var(--card); border: 1px solid var(--border); border-radius: 10px; cursor: pointer; outline: none;
      transition: background .12s, border-color .12s;
    }
    button.active { background: var(--accent-soft); border-color: var(--accent); }
    button:disabled { cursor: progress; }
    button:disabled:not(.active) { opacity: .45; }
    .icon { display: grid; place-items: center; width: 36px; height: 36px; border-radius: 8px; background: var(--tile); color: var(--muted); }
    button.active .icon { background: var(--accent); color: var(--bg); }
    .label { display: block; font-weight: 600; }
    .sub { display: block; margin-top: 1px; font-size: 11.5px; color: var(--muted); }
    kbd {
      min-width: 22px; padding: 2px 6px; font: 600 11px ui-monospace, "Cascadia Mono", monospace; text-align: center;
      color: var(--muted); background: var(--bg); border: 1px solid var(--border); border-bottom-width: 2px; border-radius: 5px;
    }
    button.active kbd { color: var(--accent); border-color: var(--accent); }

    footer { display: flex; gap: 14px; padding: 9px 14px 11px; border-top: 1px solid var(--border); color: var(--faint); font-size: 11.5px; }
    footer kbd { min-width: 0; padding: 0 4px; font-size: 10.5px; border-bottom-width: 1px; margin-right: 3px; }

    #status { display: flex; align-items: center; gap: 8px; padding: 0 14px 10px; color: var(--muted); font-size: 12px; }
    #status:empty { display: none; }
    #status.err { color: var(--err); }
    #status.busy::before {
      content: ""; width: 12px; height: 12px; flex: none; border-radius: 50%;
      border: 2px solid var(--border); border-top-color: var(--accent); animation: spin .7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <header>
    <img src="icons/icon32.png" alt="">
    <h1>SnapShift</h1>
    <a href="#" id="shortcuts" title="Change keyboard shortcuts" aria-label="Change keyboard shortcuts">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="6" width="20" height="12" rx="2"/><path d="M6 10h.01M10 10h.01M14 10h.01M18 10h.01M7 14h10"/></svg>
    </a>
  </header>

  <div class="options">
    <button data-mode="visible">
      <span class="icon">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="13" rx="2"/><path d="M8 21h8M12 17v4"/></svg>
      </span>
      <span><span class="label">Visible area</span><span class="sub">What's on screen now</span></span>
      <kbd>V</kbd>
    </button>
    <button data-mode="full">
      <span class="icon">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2h9l4 4v16H6z"/><path d="M14 2v5h5"/><path d="M12.5 10v8M9.5 15l3 3 3-3"/></svg>
      </span>
      <span><span class="label">Full page</span><span class="sub">Scrolls and stitches it all</span></span>
      <kbd>F</kbd>
    </button>
    <button data-mode="select">
      <span class="icon">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8V6a2 2 0 0 1 2-2h2M16 4h2a2 2 0 0 1 2 2v2M20 16v2a2 2 0 0 1-2 2h-2M8 20H6a2 2 0 0 1-2-2v-2"/><path d="M12 8v8M8 12h8"/></svg>
      </span>
      <span><span class="label">Select area</span><span class="sub">Drag on the page</span></span>
      <kbd>S</kbd>
    </button>
  </div>

  <div id="status"></div>

  <footer>
    <span><kbd>↵</kbd>Capture</span>
    <span><kbd>↑↓</kbd>Switch</span>
    <span><kbd>Esc</kbd>Close</span>
  </footer>

  <script src="popup.js"></script>
</body>
</html>
