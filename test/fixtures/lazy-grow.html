<!DOCTYPE html><meta charset="utf-8"><style>html,body{margin:0;background:#fff}.b{height:1000px}</style>
<div id="c"><div style="height:1500px;background:#00ff00"></div></div>
<script>
let added=0;
addEventListener('scroll',()=>{
  if(added<2&&scrollY+innerHeight>=document.documentElement.scrollHeight-200){
    added++;const d=document.createElement('div');d.style.cssText='height:1000px;background:'+(added==2?'#ffff00':'#00ff00');
    document.getElementById('c').append(d);
  }
});
</script>
